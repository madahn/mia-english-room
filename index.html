<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="미아와 함께하는 유아 영어 회화 연습 앱">
</head>
<body>
<title>Mia's English Room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Jua&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one-screen kids' classroom. Tutor avatar on a stage, a lesson board below, big round controls. */
:root{
  --bg:#E6F4FF; --bg2:#FFF7D6; --surface:#FFFFFF; --surface2:#F3F8FF;
  --fg:#22314F; --muted:#6C7A98; --line:#D6E3F3;
  --accent:#FFB703; --accent-ink:#4A3300; --coral:#FB6F92; --mint:#2EC4B6; --sky:#4FA8F5; --grape:#9B6BF2;
  --good:#3BB273; --bad:#E76F51;
  --skin:#F6CBA8; --hair:#5B3A29; --shirt:#2EC4B6; --blush:#F8A5A5; --lip:#C0392B; --mouth:#7B2222;
  --shadow:0 10px 30px rgba(34,49,79,.10);
  --font-display:'Fredoka','Jua',ui-rounded,'Apple SD Gothic Neo',sans-serif;
  --font-body:'Nunito','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --radius:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A2E; --bg2:#1A2238; --surface:#1E2940; --surface2:#263352;
    --fg:#F2F6FC; --muted:#A3B0CC; --line:#324266;
    --accent:#FFC53D; --accent-ink:#2B1D00; --shadow:0 10px 30px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121A2E; --bg2:#1A2238; --surface:#1E2940; --surface2:#263352;
  --fg:#F2F6FC; --muted:#A3B0CC; --line:#324266;
  --accent:#FFC53D; --accent-ink:#2B1D00; --shadow:0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(circle at 15% 10%,var(--bg2) 0,transparent 35%),radial-gradient(circle at 90% 90%,color-mix(in srgb,var(--mint) 18%,transparent) 0,transparent 40%);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:3px;border-radius:12px}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:12px 28px;min-height:100%;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--font-display);font-weight:600;text-wrap:balance;margin:0;line-height:1.15}
.ko{font-family:var(--font-body)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:42px;height:42px;border-radius:14px;background:var(--accent);display:grid;place-items:center;font-size:22px;box-shadow:var(--shadow)}
.brand h1{font-size:1.45rem}
.brand small{display:block;color:var(--muted);font-size:.8rem;font-family:var(--font-body);font-weight:600}
.topright{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;font-size:20px;box-shadow:var(--shadow);transition:transform .15s}
.iconbtn:hover{transform:translateY(-2px)}

/* home */
.hero{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;background:var(--surface);border-radius:var(--radius);padding:14px 18px;box-shadow:var(--shadow)}
.hero .avatar-box{width:150px;height:170px}
.hero h2{font-size:1.6rem}
.hero p{margin:6px 0 0;color:var(--muted)}
.hero .cta{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;font-family:var(--font-display);font-size:1.05rem;font-weight:600;background:var(--surface2);border:2px solid var(--line);transition:transform .15s,box-shadow .15s;min-height:48px}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.coral{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.mint{background:var(--mint);border-color:var(--mint);color:#0B3B37}
.btn.ghost{background:transparent}

.levels{display:flex;flex-direction:column;gap:16px}
.level{background:var(--surface);border-radius:var(--radius);padding:16px 18px 18px;box-shadow:var(--shadow);border-top:8px solid var(--lv)}
.level header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.level header h3{font-size:1.3rem;display:flex;align-items:center;gap:10px}
.level header .step{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--lv);color:#fff;font-size:1rem}
.level header .desc{color:var(--muted);font-size:.9rem}
.level .prog{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:12px}
.level .prog i{display:block;height:100%;background:var(--lv);border-radius:99px;transition:width .4s}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 10px 12px;border-radius:18px;background:var(--surface2);border:2px solid var(--line);text-align:center;transition:transform .15s,border-color .15s;min-width:0}
.card:hover{transform:translateY(-3px);border-color:var(--lv)}
.card .em{font-size:2rem;line-height:1}
.card .t{font-family:var(--font-display);font-weight:600;font-size:1.05rem}
.card .k{font-size:.8rem;color:var(--muted)}
.card .stars{font-size:.85rem;letter-spacing:1px;color:var(--accent)}
.card .stars.none{color:var(--line)}
.card .rec{position:absolute;top:-10px;right:8px;background:var(--coral);color:#fff;font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:99px}
.card.locked{opacity:.5}

/* lesson */
.lesson-top{display:flex;align-items:center;gap:10px}
.lesson-top .title{flex:1;min-width:0}
.lesson-top .title h2{font-size:1.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesson-top .title .k{color:var(--muted);font-size:.85rem}
.steps{display:flex;gap:4px;flex:1;max-width:260px}
.steps i{flex:1;height:8px;border-radius:99px;background:var(--line)}
.steps i.done{background:var(--good)}
.steps i.cur{background:var(--accent)}
.steps i.miss{background:var(--coral)}

.stage{display:grid;grid-template-columns:220px 1fr;gap:14px;align-items:end}
.avatar-box{position:relative;width:220px;height:250px;margin:0 auto}
.avatar-box svg{width:100%;height:100%;overflow:visible}
.bubble{position:relative;background:var(--surface);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);min-height:84px;display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0}
.bubble:before{content:"";position:absolute;left:-12px;bottom:28px;border:12px solid transparent;border-right-color:var(--surface);border-left:0}
.bubble .en{font-family:var(--font-display);font-size:1.35rem;font-weight:600;line-height:1.3}
.bubble .ko{color:var(--muted);font-size:.95rem}
.bubble .hint{font-size:.85rem;color:var(--sky);font-weight:700}

.board{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:14px;min-height:220px}
.visual{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.visual .big{font-size:5.5rem;line-height:1}
.visual .letter{font-family:var(--font-display);font-size:4.2rem;font-weight:700;line-height:1;color:var(--sky)}
.visual .word{font-family:var(--font-display);font-size:1.8rem;font-weight:600}
.visual .ipa{color:var(--muted);font-size:.95rem}
.visual .swatch{width:90px;height:90px;border-radius:30px;border:4px solid var(--line)}
.yourline{width:100%;max-width:560px;background:var(--surface2);border:2px dashed var(--line);border-radius:18px;padding:12px 16px;text-align:center}
.yourline .lab{font-size:.8rem;font-weight:800;color:var(--coral);letter-spacing:.06em;text-transform:uppercase}
.yourline .en{font-family:var(--font-display);font-size:1.5rem;font-weight:600;margin-top:2px}
.yourline .ko{color:var(--muted);font-size:.95rem}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;width:100%;max-width:640px}
.opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 10px;border-radius:18px;background:var(--surface2);border:3px solid var(--line);font-family:var(--font-display);font-size:1.1rem;font-weight:600;transition:transform .12s,border-color .12s;min-width:0}
.opt .em{font-size:2.6rem;line-height:1}
.opt .sw{width:52px;height:52px;border-radius:18px}
.opt:hover{transform:translateY(-3px);border-color:var(--sky)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--surface2))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface2));animation:shake .35s}
.opt.pick .em{font-size:1.8rem}
.opt.pick{font-size:1rem;padding:12px}
.opt .ko{font-family:var(--font-body);font-size:.8rem;color:var(--muted);font-weight:600}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.heard{font-size:.9rem;color:var(--muted);min-height:1.4em;text-align:center}
.heard b{color:var(--fg)}
.feedback{font-family:var(--font-display);font-size:1.15rem;font-weight:600;min-height:1.5em;text-align:center}
.feedback.good{color:var(--good)}
.feedback.bad{color:var(--bad)}

.controls{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap}
.round{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.8rem;font-weight:800;color:var(--muted)}
.round b{display:grid;place-items:center;width:68px;height:68px;border-radius:50%;background:var(--surface);border:3px solid var(--line);font-size:28px;box-shadow:var(--shadow);transition:transform .15s}
.round:hover b{transform:scale(1.06)}
.round.mic b{background:var(--coral);border-color:var(--coral);width:84px;height:84px;font-size:36px}
.round.mic.listening b{animation:pulse 1s infinite;box-shadow:0 0 0 0 color-mix(in srgb,var(--coral) 60%,transparent)}
.round.said b{background:var(--mint);border-color:var(--mint);width:84px;height:84px;font-size:34px}
.round.next b{background:var(--accent);border-color:var(--accent)}
.round:disabled{opacity:.4;cursor:not-allowed}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--coral) 55%,transparent)}100%{box-shadow:0 0 0 22px transparent}}

/* chat (free talk) */
.chat{width:100%;max-width:640px;display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto;padding:4px}
.msg{max-width:85%;padding:10px 14px;border-radius:18px;font-size:1rem;line-height:1.35}
.msg.mia{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:6px}
.msg.kid{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.msg .ko{display:block;font-size:.8rem;color:var(--muted);margin-top:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{padding:10px 14px;border-radius:999px;background:var(--surface2);border:2px solid var(--line);font-family:var(--font-display);font-weight:600;font-size:1rem}
.chip:hover{border-color:var(--sky)}
.typeline{display:flex;gap:8px;width:100%;max-width:640px}
.typeline input{flex:1;min-width:0;padding:12px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface2);color:var(--fg);font:inherit;font-size:1rem}
.notice{background:var(--surface2);border:2px solid var(--line);border-radius:16px;padding:12px 16px;color:var(--muted);font-size:.9rem;max-width:560px;text-align:center}

/* finish */
.finish{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
.finish .bigstars{font-size:3.2rem;letter-spacing:4px;color:var(--accent)}
.finish .bigstars .off{color:var(--line)}
.finish h2{font-size:1.7rem}
.finish p{margin:0;color:var(--muted)}

/* settings */
dialog{border:0;border-radius:var(--radius);background:var(--surface);color:var(--fg);padding:0;max-width:min(520px,calc(100vw - 32px));box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,20,40,.45)}
.dlg{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.dlg h2{font-size:1.3rem}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.row label{font-weight:700}
.row select,.row input[type=range]{font:inherit;padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);color:var(--fg);max-width:100%}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{padding:8px 14px;font-weight:700}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.note{font-size:.85rem;color:var(--muted)}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* avatar animation */
.eye{animation:blink 4.2s infinite}
.eye:nth-of-type(2){animation-delay:.05s}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.avatar.speaking #head{animation:nod .62s ease-in-out infinite}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(-2.2deg) translateY(1px)}}
.avatar.wave #armL{animation:wave .7s ease-in-out 3}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-28deg)}}
.avatar.cheer #head{animation:hop .5s ease-in-out 2}
.avatar.cheer .eye{transform:scaleY(.55);animation:none}
.avatar.cheer #browL,.avatar.cheer #browR{transform:translateY(-3px)}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.avatar.think #browL{transform:translateY(-3px) rotate(-8deg)}
.avatar.think #browR{transform:translateY(1px)}
.avatar.think #head{transform:rotate(4deg)}
.avatar.oops #browL,.avatar.oops #browR{transform:translateY(2px)}
.avatar.oops #head{transform:rotate(-3deg)}
#head,#browL,#browR,.eye,#armL{transition:transform .25s}
.avatar.listening #earR{animation:wiggle .4s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}50%{transform:rotate(8deg)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:0s!important}
}
@media (max-width:640px){
  .hero{grid-template-columns:1fr;text-align:center;justify-items:center}
  .stage{grid-template-columns:1fr;gap:8px}
  .avatar-box{width:160px;height:182px}
  .bubble:before{left:50%;bottom:auto;top:-12px;margin-left:-12px;border:12px solid transparent;border-bottom-color:var(--surface);border-top:0}
  .bubble .en{font-size:1.15rem}
  .visual .big{font-size:4.2rem}
  .steps{max-width:140px}
  .round b{width:60px;height:60px;font-size:24px}
  .round.mic b,.round.said b{width:74px;height:74px}
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">🎈</div>
      <div><h1>Mia's English Room</h1><small class="ko">미아와 함께하는 유아 영어 회화</small></div>
    </div>
    <div class="topright">
      <span class="pill" title="모은 별"><span aria-hidden="true">⭐</span> <span id="starTotal">0</span></span>
      <button class="iconbtn" id="btnHome" title="홈으로" aria-label="홈으로">🏠</button>
      <button class="iconbtn" id="btnSettings" title="설정" aria-label="설정">⚙️</button>
    </div>
  </header>

  <main id="home">
    <section class="hero">
      <div class="avatar-box" id="avatarHome"></div>
      <div>
        <h2 id="homeGreeting">Hi! I'm Mia. Let's play with English!</h2>
        <p class="ko">파닉스부터 일상회화까지, 한 단계씩 미아와 대화하며 배워요. 미아의 말을 듣고, 따라 말하고, 별을 모아 보세요.</p>
        <div class="cta">
          <button class="btn primary" id="btnContinue">▶ 이어서 배우기</button>
          <button class="btn ghost" id="btnHello">👋 미아에게 인사하기</button>
        </div>
      </div>
    </section>
    <div class="levels" id="levels"></div>
  </main>

  <main id="lesson" hidden>
    <div class="lesson-top">
      <button class="iconbtn" id="btnBack" aria-label="레슨 나가기">←</button>
      <div class="title"><h2 id="lsTitle">Lesson</h2><div class="k ko" id="lsKo"></div></div>
      <div class="steps" id="stepBar" aria-label="진행 상황"></div>
    </div>
    <section class="stage">
      <div class="avatar-box" id="avatarLesson"></div>
      <div class="bubble" id="bubble" aria-live="polite">
        <div class="en" id="bubbleEn">Hello!</div>
        <div class="ko" id="bubbleKo"></div>
        <div class="hint" id="bubbleHint"></div>
      </div>
    </section>
    <section class="board" id="board"></section>
    <div class="controls" id="controls"></div>
  </main>
</div>

<dialog id="settings">
  <form method="dialog" class="dlg">
    <h2>설정 <span class="ko" style="font-size:.9rem;color:var(--muted)">(부모님용)</span></h2>
    <div class="row"><label for="selVoice">미아 목소리</label><select id="selVoice"></select></div>
    <div class="row"><label for="rngRate">말하는 속도</label><input type="range" id="rngRate" min="0.6" max="1.1" step="0.05" value="0.85"></div>
    <div class="row"><label>자동으로 다시 듣기</label><span class="seg"><button type="button" id="repOn">켜기</button><button type="button" id="repOff">끄기</button></span></div>
    <div class="row"><label>마이크 상태</label><span class="note" id="micStatus">확인 중…</span></div>
    <p class="note ko">마이크로 말하기 기능은 Chrome, Edge, Safari 최신 버전에서 동작해요. 마이크를 쓸 수 없는 환경에서는 "말했어요!" 버튼으로 진행합니다.</p>
    <div class="row">
      <button type="button" class="btn ghost" id="btnReset">진도 초기화</button>
      <button class="btn primary" value="close">닫기</button>
    </div>
  </form>
</dialog>

<canvas id="confetti"></canvas>

<script>
window.addEventListener('error',e=>{const d=document.createElement('div');d.style.cssText='position:fixed;left:16px;right:16px;bottom:16px;z-index:99;background:#E76F51;color:#fff;padding:12px 16px;border-radius:14px;font:14px/1.4 system-ui';d.textContent='앱 실행 중 오류: '+(e.message||e);document.body.appendChild(d)});
/* ---------- Curriculum data ---------- */
const PHONICS=[
 ['A','apple','🍎','/æ/'],['B','ball','⚽','/b/'],['C','cat','🐱','/k/'],['D','dog','🐶','/d/'],['E','egg','🥚','/e/'],
 ['F','fish','🐟','/f/'],['G','goat','🐐','/g/'],['H','hat','🎩','/h/'],['I','igloo','🧊','/ɪ/'],['J','juice','🧃','/dʒ/'],
 ['K','kite','🪁','/k/'],['L','lion','🦁','/l/'],['M','moon','🌙','/m/'],['N','nose','👃','/n/'],['O','octopus','🐙','/ɒ/'],
 ['P','pig','🐷','/p/'],['Q','queen','👸','/kw/'],['R','rabbit','🐰','/r/'],['S','sun','☀️','/s/'],['T','tiger','🐯','/t/'],
 ['U','umbrella','☂️','/ʌ/'],['V','violin','🎻','/v/'],['W','whale','🐳','/w/'],['X','box','📦','/ks/'],['Y','yo-yo','🪀','/j/'],['Z','zebra','🦓','/z/']

/* ---------- Speech (TTS) ---------- */
const synth=window.speechSynthesis;
let voices=[],voice=null;
const prefs=load('mia-prefs',{rate:0.85,voiceName:null,autoRepeat:true});
function pickVoice(){
  if(!synth)return;
  voices=synth.getVoices().filter(v=>/^en/i.test(v.lang));
  const sel=document.getElementById('selVoice');
  sel.innerHTML=voices.map(v=>`<option value="${esc(v.name)}">${esc(v.name)} (${v.lang})</option>`).join('')||'<option value="">기본 목소리</option>';
  const fav=['Samantha','Google US English','Microsoft Aria','Microsoft Jenny','Karen','Moira','Ava','Allison','Zira'];
  voice=voices.find(v=>v.name===prefs.voiceName)||fav.map(n=>voices.find(v=>v.name.includes(n))).find(Boolean)||voices.find(v=>v.lang==='en-US')||voices[0]||null;
  if(voice)sel.value=voice.name;
}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice}
function speak(text,{rate}={}){
  return new Promise(res=>{
    if(!synth){setTimeout(res,600);return}
    synth.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US';if(voice)u.voice=voice;u.rate=rate||prefs.rate;u.pitch=1.1;
    let done=false;const fin=()=>{if(done)return;done=true;mouth(false);res()};
    u.onstart=()=>mouth(true);u.onend=fin;u.onerror=fin;
    setTimeout(fin,Math.max(2500,text.length*120));
    synth.speak(u);
  });
}
function stopSpeak(){if(synth)synth.cancel();mouth(false)}

/* ---------- Speech recognition (STT) ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let micState=SR?'unknown':'unsupported';
let rec=null;
function listen(){
  return new Promise((res,rej)=>{
    if(!SR){rej('unsupported');return}
    try{rec=new SR()}catch(e){rej('unsupported');return}
    rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=5;rec.continuous=false;
    let settled=false;
    rec.onresult=e=>{settled=true;res(Array.from(e.results[0]).map(a=>a.transcript))};
    rec.onerror=e=>{settled=true;rej(e.error||'error')};
    rec.onend=()=>{if(!settled){settled=true;res([])}};
    try{rec.start()}catch(e){rej('error')}
    setTimeout(()=>{try{rec.stop()}catch(e){}},7000);
  });
}
function stopListen(){try{rec&&rec.stop()}catch(e){}}
function micLabel(){return {unsupported:'이 브라우저는 음성 인식을 지원하지 않아요',unknown:'첫 번째 말하기에서 권한을 물어요',ok:'사용 가능 ✅',denied:'마이크를 사용할 수 없어요 (권한 거부 또는 차단된 환경)'}[micState]}

const norm=s=>s.toLowerCase().replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const sim=(a,b)=>1-lev(a,b)/Math.max(a.length,b.length,1);
function matches(heard,target,accept=[]){
  const H=heard.map(norm).filter(Boolean);if(!H.length)return false;
  const T=norm(target.replace(/_+/g,''));
  const keys=accept.map(norm);
  for(const h of H){
    if(keys.some(k=>k&&h.includes(k)))return true;
    if(h.includes(T)||T.includes(h)&&h.length>=Math.min(3,T.length))return true;
    if(sim(h,T)>=0.72)return true;
    const tw=T.split(' ').filter(w=>w.length>2),hw=h.split(' ');
    if(tw.length&&tw.filter(w=>hw.some(x=>sim(x,w)>=0.8)).length/tw.length>=0.6)return true;
  }
  return false;
}

const LEVELS=[
 {id:'phonics',title:'Phonics',ko:'파닉스 · 알파벳 소리',color:'#4FA8F5',desc:'글자 이름과 소리, 대표 단어를 듣고 따라 말해요.',lessons:[0,1,2,3,4].map(i=>({id:'ph'+i,title:PHONICS[i*5]?.[0]+'–'+PHONICS[Math.min(i*5+(i===4?5:4),25)][0],ko:'알파벳 '+(i*5+1)+'~'+Math.min(i*5+(i===4?6:5),26),em:PHONICS[i*5][2],build:()=>buildPhonics(i)}))},

];
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function buildPhonics(i){
  const set=PHONICS.slice(i*5,i===4?26:i*5+5);
  const steps=set.map(([L,w,em,ipa])=>({type:'say',letter:L,emoji:em,word:w,ipa,prompt:`This is the letter ${L}. ${L} is for ${w}. Can you say... ${w}?`,ko:`${L}는 ${w}의 첫소리예요. 따라 말해요: ${w}`,target:w,accept:[L.toLowerCase(),w]}));
  shuffle(set).slice(0,3).forEach(([L,w,em])=>{
    const others=shuffle(set.filter(x=>x[0]!==L)).slice(0,2);
    const opts=shuffle([[L,w,em],...others]);
    steps.push({type:'choose',prompt:`Which one starts with ${L}? ${L}, like ${w}.`,ko:`${L}로 시작하는 그림을 찾아요`,opts:opts.map(o=>({label:o[1],em:o[2]})),answer:opts.findIndex(o=>o[0]===L),say:w});
  });
  return steps;
}
function wordFrame(w,word){
  const plural=/^(eyes|teeth)$/.test(word),noArt=/^(ice cream|mom|dad|grandma|grandpa)$/.test(word);
  if(w.id==='colors')return `This is ${word}.`;
  if(w.id==='numbers')return `This is number ${word}.`;
  if(w.id==='feelings')return `He feels ${word}.`;
  if(w.id==='weather')return `It is ${word}.`;
  if(plural)return `These are ${word}.`;
  return `This is ${noArt?'':/^[aeiou]/.test(word)?'an ':'a '}${word}.`;
}
function findFrame(w,word){
  if(w.id==='feelings')return `Who feels ${word}? Find ${word}!`;
  if(w.id==='weather')return `Which one is ${word}? Find ${word}!`;
  if(w.id==='colors')return `Where is ${word}? Find ${word}!`;
  return `Where ${/^(eyes|teeth)$/.test(word)?'are':'is'} the ${word}? Find ${word}!`;
}
function buildWords(w){
  const steps=w.items.map(([word,vis])=>({type:'say',emoji:w.color?null:vis,swatch:w.color?vis:null,word,prompt:`${cap(word)}. ${wordFrame(w,word)} Say: ${word}.`,ko:`따라 말해요: ${word}`,target:word}));
  shuffle(w.items).slice(0,4).forEach(([word,vis],k)=>{
    const others=shuffle(w.items.filter(x=>x[0]!==word)).slice(0,2);
    const opts=shuffle([[word,vis],...others]);
    if(k%2===0)steps.push({type:'choose',prompt:findFrame(w,word),ko:`${word}를 찾아요`,opts:opts.map(o=>({label:o[0],em:w.color?null:o[1],sw:w.color?o[1]:null})),answer:opts.findIndex(o=>o[0]===word),say:word});
    else steps.push({type:'choose',prompt:w.ask,ko:'그림을 보고 알맞은 단어를 골라요',show:{emoji:w.color?null:vis,swatch:w.color?vis:null},opts:opts.map(o=>({label:o[0]})),answer:opts.findIndex(o=>o[0]===word),say:word});
  });
  return steps;
}
function buildTalk(t){
  const steps=t.lines.map(l=>({type:'line',prompt:l.t,child:l.c,ko:l.ko,accept:l.accept||[]}));
  t.quiz.forEach(q=>steps.push({type:'choose',prompt:q.q,ko:q.ko,opts:q.opts.map(o=>({label:o[0],em:o[1]})),answer:q.a,say:q.opts[q.a][0],wide:true}));
  return steps;
}
function buildDaily(d){
  return d.lines.map(l=>l.pick?{type:'pick',prompt:l.t,picks:l.pick}:{type:'line',prompt:l.t,child:l.c,ko:l.ko,accept:l.accept||[]});
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* ---------- Lesson engine ---------- */
const S={lesson:null,steps:[],i:0,results:[],tries:0,phase:null,heard:''};
function startLesson(id){
  const ls=allLessons().find(l=>l.id===id);if(!ls)return;
  S.lesson=ls;S.steps=ls.build();S.i=0;S.results=[];S.tries=0;
  const lv=LEVELS.find(l=>l.lessons.includes(ls));
  $('lsTitle').textContent=`${ls.em} ${ls.title}`;$('lsKo').textContent=`${lv.title} · ${ls.ko}`;
  $('home').hidden=true;$('lesson').hidden=false;window.scrollTo(0,0);
  if(ls.free)renderFree();else renderStep();
}
function exitLesson(){stopSpeak();stopListen();setListening(false);$('lesson').hidden=true;$('home').hidden=false;renderHome()}
function stepBar(){$('stepBar').innerHTML=S.steps.map((_,k)=>`<i class="${k<S.i?(S.results[k]?'done':'miss'):k===S.i?'cur':''}"></i>`).join('')}
function bubble(en,ko='',hint=''){$('bubbleEn').textContent=en;$('bubbleKo').textContent=ko;$('bubbleHint').textContent=hint}
function visualHTML(v){if(!v)return'';return `<div class="visual">${v.letter?`<div class="letter">${v.letter}<span style="font-size:.55em;color:var(--muted)">${v.letter.toLowerCase()}</span></div>`:''}${v.emoji?`<div class="big" aria-hidden="true">${v.emoji}</div>`:''}${v.swatch?`<div class="swatch" style="background:${v.swatch}"></div>`:''}${v.word?`<div class="word">${esc(v.word)}</div>`:''}${v.ipa?`<div class="ipa">소리 ${v.ipa}</div>`:''}</div>`}
function ctrl(items){$('controls').innerHTML=items.map(it=>`<button class="round ${it.cls||''}" id="${it.id}" ${it.dis?'disabled':''}><b aria-hidden="true">${it.icon}</b><span class="ko">${it.label}</span></button>`).join('')}

async function renderStep(){
  stopListen();setListening(false);
  if(S.i>=S.steps.length){finishLesson();return}
  const st=S.steps[S.i];S.tries=0;S.phase='intro';stepBar();mood(null);
  const board=$('board');
  if(st.type==='say'){
    bubble(st.prompt,st.ko);
    board.innerHTML=visualHTML(st)+`<div class="heard" id="heard"></div><div class="feedback" id="fb"></div>`;
    speakControls();
    await speak(st.prompt);
  }else if(st.type==='line'){
    bubble(st.prompt,'','미아의 말을 듣고, 아래 문장으로 대답해요');
    board.innerHTML=`<div class="yourline"><div class="lab">Your turn · 내 차례</div><div class="en">${esc(st.child)}</div><div class="ko">${esc(st.ko)}</div></div><div class="heard" id="heard"></div><div class="feedback" id="fb"></div>`;
    speakControls();
    await speak(st.prompt);
  }else if(st.type==='choose'){
    bubble(st.prompt,st.ko);
    board.innerHTML=(st.show?visualHTML(st.show):'')+`<div class="options ${st.wide?'wide':''}">${st.opts.map((o,k)=>`<button class="opt ${st.wide?'pick':''}" data-k="${k}">${o.em?`<span class="em" aria-hidden="true">${o.em}</span>`:''}${o.sw?`<span class="sw" style="background:${o.sw}"></span>`:''}<span>${esc(o.label)}</span></button>`).join('')}</div><div class="feedback" id="fb"></div>`;
    board.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.k,b));
    ctrl([{id:'cRepeat',icon:'🔊',label:'다시 듣기'},{id:'cSkip',icon:'⏭️',label:'건너뛰기'}]);
    $('cRepeat').onclick=()=>speak(st.prompt);$('cSkip').onclick=()=>{S.results[S.i]=false;S.i++;renderStep()};
    await speak(st.prompt);
  }else if(st.type==='pick'){
    bubble(st.prompt,'','어떻게 대답할까요? 하나를 골라요');
    board.innerHTML=`<div class="options">${st.picks.map((p,k)=>`<button class="opt pick" data-k="${k}"><span>${esc(p.c)}</span><span class="ko">${esc(p.ko)}</span></button>`).join('')}</div><div class="feedback" id="fb"></div>`;
    board.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
    ctrl([{id:'cRepeat',icon:'🔊',label:'다시 듣기'}]);
    $('cRepeat').onclick=()=>speak(st.prompt);
    await speak(st.prompt);
  }
}
function speakControls(){
  const items=[{id:'cRepeat',icon:'🔊',label:'다시 듣기'},{id:'cSlow',icon:'🐢',label:'천천히'}];
  if(micState!=='unsupported'&&micState!=='denied')items.push({id:'cMic',icon:'🎤',label:'따라 말하기',cls:'mic'});
  else items.push({id:'cSaid',icon:'✅',label:'말했어요!',cls:'said'});
  items.push({id:'cSkip',icon:'⏭️',label:'건너뛰기'});
  ctrl(items);
  const st=S.steps[S.i];
  $('cRepeat').onclick=()=>speak(st.type==='say'?st.prompt:st.child);
  $('cSlow').onclick=()=>speak(st.type==='say'?st.target:st.child,{rate:0.6});
  $('cSkip').onclick=()=>{S.results[S.i]=false;S.i++;renderStep()};
  if($('cMic'))$('cMic').onclick=doListen;
  if($('cSaid'))$('cSaid').onclick=()=>pass();
}
async function doListen(){
  const st=S.steps[S.i];const btn=$('cMic');if(!btn||btn.classList.contains('listening'))return;
  stopSpeak();btn.classList.add('listening');setListening(true);mood('think');
  $('heard').innerHTML='듣고 있어요… 🎧 말해 보세요!';
  try{
    const heard=await listen();micState='ok';$('micStatus').textContent=micLabel();
    btn.classList.remove('listening');setListening(false);
    if(!heard.length){$('heard').textContent='잘 안 들렸어요. 마이크 가까이에서 다시 말해 보세요.';mood('oops',1200);await speak("I didn't hear you. Try again!");return}
    $('heard').innerHTML=`들은 말: <b>${esc(heard[0])}</b>`;
    const target=st.type==='say'?st.target:st.child;
    if(matches(heard,target,st.accept||[]))pass();else fail();
  }catch(err){
    btn.classList.remove('listening');setListening(false);mood(null);
    if(err==='not-allowed'||err==='service-not-allowed'||err==='unsupported'||err==='audio-capture'){
      micState='denied';$('micStatus').textContent=micLabel();
      $('heard').textContent='이 환경에서는 마이크를 쓸 수 없어요. 따라 말한 뒤 "말했어요!" 버튼을 눌러요.';
      speakControls();
    }else if(err==='no-speech'){$('heard').textContent='소리가 들리지 않았어요. 다시 눌러서 말해 보세요.'}
    else{$('heard').textContent='음성 인식에 문제가 생겼어요. 다시 시도해 보세요.'}
  }
}
async function pass(){
  const st=S.steps[S.i];S.results[S.i]=S.tries===0;stepBar();
  const praise=st.react||PRAISE[Math.floor(Math.random()*PRAISE.length)];
  const fb=$('fb');if(fb){fb.className='feedback good';fb.textContent=(st.react?'Nice!':praise)+' ⭐'}
  mood('cheer',1500);ding();
  await speak(praise);
  await wait(300);S.i++;renderStep();
}
async function fail(){
  const st=S.steps[S.i];S.tries++;
  const fb=$('fb');fb.className='feedback bad';fb.textContent=RETRY[Math.min(S.tries-1,RETRY.length-1)];
  mood('oops',1200);
  await speak(fb.textContent);
  if(prefs.autoRepeat)await speak(st.type==='say'?st.target:st.child,{rate:0.7});
  if(S.tries>=3){$('heard').innerHTML+=' <span class="ko">(한 번 더 어려우면 건너뛰기를 눌러도 괜찮아요)</span>'}
}
async function choose(k,btn){
  const st=S.steps[S.i];if(S.phase==='done')return;
  if(k===st.answer){S.phase='done';btn.classList.add('right');S.results[S.i]=S.tries===0;stepBar();mood('cheer',1500);ding();
    const fb=$('fb');fb.className='feedback good';fb.textContent=PRAISE[Math.floor(Math.random()*PRAISE.length)];
    await speak(`Yes! ${st.say}. ${fb.textContent}`);await wait(300);S.i++;renderStep();
  }else{S.tries++;btn.classList.add('wrong');mood('oops',1000);const fb=$('fb');fb.className='feedback bad';fb.textContent='Hmm, not that one. Try again!';
    await speak(`Not that one. ${st.prompt}`);setTimeout(()=>btn.classList.remove('wrong'),500)}
}
async function pick(k){
  const st=S.steps[S.i];const p=st.picks[k];
  S.steps.splice(S.i+1,0,{type:'line',prompt:st.prompt,child:p.c,ko:p.ko,accept:[],react:p.r});
  S.results[S.i]=true;S.i++;stepBar();
  bubble(st.prompt,'','좋아요! 이제 그 문장을 따라 말해요');
  await renderStep();
}
async function finishLesson(){
  const n=S.steps.length,ok=S.results.filter(Boolean).length,ratio=n?ok/n:0;
  const stars=ratio>=0.9?3:ratio>=0.6?2:1;
  const prev=progress[S.lesson.id]||{};
  progress[S.lesson.id]={stars:Math.max(prev.stars||0,stars),last:Date.now(),plays:(prev.plays||0)+1};save('mia-progress',progress);updateStarTotal();stepBar();
  bubble('You finished the lesson! I am so proud of you!','레슨을 모두 마쳤어요! 정말 잘했어요!');
  const all=allLessons(),idx=all.indexOf(S.lesson),next=all[idx+1];
  $('board').innerHTML=`<div class="finish"><div class="bigstars" aria-label="별 ${stars}개">${'★'.repeat(stars)}<span class="off">${'★'.repeat(3-stars)}</span></div><h2>${S.lesson.title} 완료!</h2><p class="ko">${ok} / ${n} 성공 · 지금까지 모은 별 ⭐ ${totalStars()}</p>
    <div class="cta" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px"><button class="btn ghost" id="fAgain">🔁 다시 하기</button>${next?`<button class="btn primary" id="fNext">▶ 다음: ${esc(next.title)}</button>`:''}<button class="btn mint" id="fHome">🏠 홈으로</button></div></div>`;
  $('controls').innerHTML='';
  $('fAgain').onclick=()=>startLesson(S.lesson.id);if(next)$('fNext').onclick=()=>startLesson(next.id);$('fHome').onclick=exitLesson;
  mood('cheer',2500);confetti();fanfare();
  await speak(`You finished the lesson! ${stars===3?'Three stars! Amazing!':stars===2?'Two stars! Great work!':'One star! Good try! Let us practice again.'}`);
}

  $('cRepeat').onclick=()=>{const last=[...chat].reverse().find(m=>m.role==='assistant');if(last)speak(JSON.parse(last.content).reply)};
  $('cEnd').onclick=()=>{progress['d_freetalk']={stars:Math.max(starsOf('d_freetalk'),Math.min(3,Math.ceil(chat.filter(m=>m.role==='user').length/2))),last:Date.now()};save('mia-progress',progress);exitLesson()};
  if($('cMic'))$('cMic').onclick=async()=>{const b=$('cMic');if(b.classList.contains('listening'))return;stopSpeak();b.classList.add('listening');setListening(true);$('heard').textContent='듣고 있어요… 🎧';
    try{const h=await listen();micState='ok';b.classList.remove('listening');setListening(false);$('heard').textContent='';if(h.length)sendKid(h[0]);else $('heard').textContent='잘 안 들렸어요. 다시 말해 보세요.'}
    catch(err){b.classList.remove('listening');setListening(false);if(['not-allowed','service-not-allowed','audio-capture','unsupported'].includes(err)){micState='denied';$('micStatus').textContent=micLabel();b.remove();$('heard').textContent='이 환경에서는 마이크를 쓸 수 없어요. 아래 버튼을 누르거나 글로 적어 보세요.'}else $('heard').textContent='다시 시도해 보세요.'}};
  $('typeForm').onsubmit=e=>{e.preventDefault();const v=$('typeIn').value.trim();if(v){$('typeIn').value='';sendKid(v)}};
  await miaTurn(`Start the conversation: greet the child warmly and ask one very easy question.`);
}
function addMsg(role,en,ko){const c=$('chat');if(!c)return;const d=document.createElement('div');d.className='msg '+(role==='mia'?'mia':'kid');d.textContent=en;if(ko){const s=document.createElement('span');s.className='ko';s.textContent=ko;d.appendChild(s)}c.appendChild(d);c.scrollTop=c.scrollHeight}
function setChips(list){const c=$('chips');if(!c)return;c.innerHTML='';list.forEach(s=>{const b=document.createElement('button');b.className='chip';b.textContent=s;b.onclick=()=>sendKid(s);c.appendChild(b)})}
async function sendKid(text){
  addMsg('kid',text);chat.push({role:'user',content:text});setChips([]);
  await miaTurn();
}
async function miaTurn(kick){
  const turns=[{role:'user',content:MIA_SYSTEM+(kick?'\n\n'+kick:'')}].concat(kick?[]:[{role:'assistant',content:'{"reply":"Okay! I am ready to talk with the child.","ko":"","suggestions":[]}'}],chat);
  mood('think');$('heard')&&($('heard').textContent='미아가 생각하고 있어요…');
  try{
    const out=await sampleNS.json(turns,{modelTier:'quick',cache:false});
    const reply=String(out?.reply||'Hello!'),ko=String(out?.ko||''),sugg=Array.isArray(out?.suggestions)?out.suggestions.slice(0,3).map(String):[];
    chat.push({role:'assistant',content:JSON.stringify({reply,ko,suggestions:sugg})});
    addMsg('mia',reply,ko);setChips(sugg);bubble(reply,ko);mood(null);$('heard')&&($('heard').textContent='');
    await speak(reply);
  }catch(e){
    mood('oops',1200);const code=e?.code||'';
    $('heard')&&($('heard').textContent=code==='not_granted'?'AI 대화 권한이 허용되지 않았어요. 준비된 대화 연습을 이용해 주세요.':code==='rate_limited'?'잠시 후 다시 시도해 주세요.':'미아가 잠깐 쉬고 있어요. 다시 보내 보세요.');
    if(code==='not_granted'||code==='sampling_disabled'||code==='not_declared'){sampleNS=null;setTimeout(renderFree,1200)}
  }
}

/* ---------- Sound & confetti ---------- */
let actx=null;
function tone(f,t,dur,type='sine',g=.18){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),v=actx.createGain();o.type=type;o.frequency.value=f;v.gain.value=g;o.connect(v);v.connect(actx.destination);o.start(actx.currentTime+t);v.gain.setValueAtTime(g,actx.currentTime+t);v.gain.exponentialRampToValueAtTime(.001,actx.currentTime+t+dur);o.stop(actx.currentTime+t+dur)}catch(e){}}
function ding(){tone(880,0,.15);tone(1320,.12,.25)}
function fanfare(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.3,'triangle'))}
function confetti(){
  const c=$('confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#FFB703','#FB6F92','#2EC4B6','#4FA8F5','#9B6BF2'];
  const ps=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:4+Math.random()*5,c:cols[Math.floor(Math.random()*5)],a:Math.random()*6}));
  let t=0;const id=setInterval(()=>{x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);x.restore()});if(++t>160){clearInterval(id);x.clearRect(0,0,c.width,c.height)}},16);
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- Settings & boot ---------- */
mountAvatar($('avatarHome'));mountAvatar($('avatarLesson'));
renderHome();
$('btnHome').onclick=exitLesson;$('btnBack').onclick=exitLesson;
$('btnContinue').onclick=()=>startLesson(nextLesson().id);
$('btnHello').onclick=async()=>{mood('wave',2200);await speak("Hello! I'm Mia. Let's play with English together!")};
$('btnSettings').onclick=()=>{$('micStatus').textContent=micLabel();$('settings').showModal()};
$('selVoice').onchange=e=>{prefs.voiceName=e.target.value;save('mia-prefs',prefs);pickVoice();speak('Hello! I am Mia.')};
$('rngRate').value=prefs.rate;$('rngRate').onchange=e=>{prefs.rate=+e.target.value;save('mia-prefs',prefs);speak('Nice to meet you!')};
function repUI(){$('repOn').classList.toggle('on',prefs.autoRepeat);$('repOff').classList.toggle('on',!prefs.autoRepeat)}
$('repOn').onclick=()=>{prefs.autoRepeat=true;save('mia-prefs',prefs);repUI()};$('repOff').onclick=()=>{prefs.autoRepeat=false;save('mia-prefs',prefs);repUI()};repUI();
$('btnReset').onclick=()=>{if($('btnReset').dataset.arm){progress={};save('mia-progress',progress);renderHome();$('btnReset').textContent='초기화 완료';delete $('btnReset').dataset.arm}else{$('btnReset').dataset.arm='1';$('btnReset').textContent='정말 초기화할까요? 다시 누르기'}};
$('settings').addEventListener('close',()=>{$('btnReset').textContent='진도 초기화';delete $('btnReset').dataset.arm});
const hour=new Date().getHours();$('homeGreeting').textContent=(hour<12?'Good morning! ':hour<18?'Good afternoon! ':'Good evening! ')+"I'm Mia. Let's play with English!";
</script>
